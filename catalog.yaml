# Capabilities the `tn` layer provides to projects above it.
# Projects read this while writing specs. If a needed capability is not here,
# the spec records it as "requires new tn-claude capability" and work is
# scheduled in the relevant tn-* repo.
#
# `spec:` (once set) points at this repo's own openspec/specs/<id>/spec.md — the
# durable, testable contract for that capability. `spec_change:` points at an
# in-flight openspec/changes/<name> proposing or revising that contract. See
# openspec/config.yaml for how this tree relates to standards/ and to a consuming
# project's own <project>-platform spec tree.
#
# Status: initial skeleton. Entries below are seeded from known repos and will be
# filled out (APIs, coordinates, contracts) as each is confirmed against its source.

version: 1

capabilities:

  - id: tn-lang
    kind: library
    summary: Language-level utility classes and functions (Strings, Objects, Iterables, Page, functional helpers).
    artifact: com.tn:tn-lang
    repo: tn-lang
    contract: n/a (plain library)

  - id: tn-query
    kind: library
    summary: Safe, simple predicate-string parsing into pluggable predicate implementations (Java, JDBC, JPA).
    artifact: com.tn.query:tn-query
    repo: tn-query
    contract: n/a (plain library)
    requested_changes:
      - by: okayat admin-console-foundation (2026-10-20)
        change: openspec/changes/query-embedded-fields
        summary: >-
          A filter (and a sort) on tn-query-jpa can name a field of an embedded type by a dotted name, e.g. `phone.number ≈ *7911*`.
          Today only top-level fields can be named; verified against Postgres that `phone.number` is rejected as an unknown name.
    related:
      - com.tn.query:tn-query-java
      - com.tn.query:tn-query-jdbc
      - com.tn.query:tn-query-jpa

  - id: tn-parent
    kind: build
    summary: Parent POM aligning Java level, dependency versions, plugin config and test-layer wiring for all JVM builds.
    artifact: com.tn:tn-parent
    repo: tn-parent

  - id: tn-temporary-token-service
    kind: service
    summary: >-
      Generic one-time-token generate/verify (owner string + type NUMERIC|BASE64 +
      TTL in minutes). No notion of email/phone/identity — the caller decides what
      "owner" means. Limits generation per owner (429 over the limit) and wrong
      guesses per token (the token is invalidated at the limit), across every
      instance. Suited to OTP-style login flows.
    repo: tn-temporary-token-service
    api: POST /v1/actions/generate-token, POST /v1/actions/verify-token, POST /v1/actions/check-expiry
    status: active
    spec: openspec/specs/tn-temporary-token-service/spec.md

  - id: tn-auth-service
    kind: service
    summary: >-
      Generic token/session service: mints and refreshes a JWT access/refresh
      token pair for an opaque subject id — no identifier, account, or user
      concept of its own. Every other claim (issuer, issued-at, expiration, a
      fresh per-token TSID as `jti`, and `token_use` = `access`|`refresh`) is
      this service's own to add, never caller-supplied. Verifiers should accept
      only `token_use` = `access` as a bearer token. Resolving an identifier to a stable id is entirely
      `tn-user-service`'s job. Each token pair is a session of its own, so a
      subject can be signed in on any number of devices; each refresh replaces
      the refresh token and starts a new refresh period, and the token just
      replaced is accepted for a short grace period (`tn.auth-service.token.
      refresh.grace-period`, 60s). A session can be ended by presenting its
      current or previous refresh token to revoke-tokens, which accepts a
      genuine refresh token whose session has already ended and rejects (400)
      anything that is not one. revoke-other-tokens ends every other session of
      a subject, sparing the one a refresh token (current, or previous within
      the grace period) belongs to, and returns how many ended; it rejects (400)
      a token that is not a genuine, unexpired refresh token of that subject
      whose session still exists. The access token lifetime is
      `tn.auth-service.token.access.time-to-live` (10 minutes by default); an
      access token already issued stays valid until it expires. A migration carries each subject's newest
      existing refresh token over as a session. A caller may also give `roles` when issuing a session
      (opaque strings, each non-blank with no whitespace): they are kept on the session and put in the
      `roles` claim of every access token it issues, after every refresh too, and never in the refresh
      token; a session from before roles has none. revoke-all-tokens ends every session of a subject.
      Supersedes tn-oauth-service (deprecated, same
      code under the `com.tn.oauthservice` package / `pilch.oauth-service.*`
      properties).
    repo: tn-auth-service
    api: >-
      POST /v1/actions/generate-tokens, POST /v1/actions/refresh-tokens,
      POST /v1/actions/revoke-tokens, POST /v1/actions/revoke-other-tokens
      ({subject, refreshToken} -> {revoked}), POST /v1/actions/revoke-all-tokens ({subject} -> {revoked});
      generate-tokens takes {subject, roles?}
    status: active
    spec: openspec/specs/tn-auth-service/spec.md

  - id: tn-user-service
    kind: service
    summary: >-
      User profile and identity anchor. `email` and `phone` are each unique,
      nullable — at most one of each per user, more than one linkable to the
      same user. `phone` is `{countryCode, number}`: the country calling code
      and the national significant number (no trunk prefix, so the UK's leading
      0 is dropped and Italy's kept), validated with libphonenumber and unique
      as a pair. Its own id is the stable id used everywhere once a user is
      authenticated, including the subject `tn-auth-service` mints a session
      for. Create/update take the same shape (email, phone, fullName,
      preferredName, no id) either way — linking or changing an identifier is
      just an update, not a separate action. Find-or-create takes either
      `email` or `phone`. A user can also have an avatar, which is an item in
      tn-media-service (a picture) and not held here: the user representation
      carries only `avatarMediaId`, the id of that item (absent with no
      avatar), set and cleared through `PUT/DELETE
      /v1/users/{id}/avatar-media`. Picking, checking and serving the picture
      is tn-media-service's.
    repo: tn-user-service
    api: >-
      GET/POST/PUT/DELETE /v1/users, POST /v1/actions/find-or-create
      ({email} or {phone: {countryCode, number}}),
      PUT /v1/users/{id}/avatar-media/{mediaId}, DELETE /v1/users/{id}/avatar-media
    status: active
    spec: openspec/specs/tn-user-service/spec.md

  - id: tn-notification-service
    kind: service
    summary: >-
      Dispatch a message (e.g. an OTP) to an email address or phone number,
      behind one send interface. Stub email/SMS channels only (log in the
      clear, for manual testing) — a real provider is a separate, later
      change, not yet requested.
    repo: tn-notification-service
    api: POST /v1/actions/send-notification
    status: active
    spec: openspec/specs/tn-notification-service/spec.md

  - id: tn-service
    kind: library
    summary: >-
      Shared service-level setup (request logging, property logging) and
      tn-auth-service access-token verification (signature, expiry, issuer,
      `token_use` = `access`) - `AccessTokenVerifier`, which a service creates
      itself from the public key and issuer, and which reads the token's `roles` claim
      (`roles(token)`, `hasRole(token, role)`). Defines `X-Delegate-User-Token`,
      the header in which a service passes a user's access token to another
      service acting on that user's behalf.
      Also gives every service that depends on it the Actuator `liveness` and `readiness` health groups
      (readiness = the service's own datasource where it has one, never another service; details never shown; 2.2.1: a service with no
      datasource starts, as group membership is not validated)
      and exposes `health` and `resilience` by default, merged with what a service exposes
      (requested by okayat, health-endpoint-libraries; `/noop` unchanged).
    artifact: com.tn.service:tn-service
    repo: tn-service
    contract: n/a (plain library)
    spec: openspec/specs/tn-service/spec.md

  - id: tn-client-feign
    kind: library
    summary: >-
      OpenFeign client support (a 404-to-Optional aspect, auto-configuration).
      Deprecated: kept for reference only. Feign must not be used. New HTTP
      clients are @HttpExchange interfaces, per standards/spring-boot/README.md
      ("HTTP clients").
    artifact: com.tn.client:tn-client-feign
    repo: tn-client-feign
    status: deprecated

  - id: tn-resilience
    kind: library
    summary: >-
      Requested by okayat (home-feed): shared configuration for protecting service-to-service calls
      (Resilience4j) - a timeout, circuit breaker, bulkhead and rate limiter per service called, with
      retries only for calls declared safe to repeat - for the @HttpExchange clients every service
      uses. Released 1.1.0; 1.2.0 adds a read-only Actuator endpoint `resilience` (state of each group's breaker, bulkhead and
      rate limiter) and a `half-open-calls` setting (requested by okayat, health-endpoint-libraries).
    spec: openspec/specs/tn-resilience/spec.md
    artifact: com.tn.resilience:tn-resilience
    repo: tn-resilience
    contract: n/a (plain library; auto-configured, settings under tn.resilience)
    status: active

  - id: tn-outbox
    kind: library
    summary: >-
      Requested by okayat (home-feed): a transactional outbox - a table written in the caller's own
      transaction and a relay that posts unsent rows to a target, repeating until acknowledged - so a
      service can record an event with its change and deliver it at least once. Released 1.1.0.
    artifact: com.tn.outbox:tn-outbox
    repo: tn-outbox
    contract: n/a (plain library; schema in META-INF/tn-outbox/outbox.sql, settings under tn.outbox)
    status: active

  - id: tn-media-service
    kind: service
    summary: >-
      Requested by okayat (media-service), released 0.1.0: owns media items - bytes in S3-compatible object storage, metadata in
      Postgres. An item is immutable with a never-reused id; replacing a picture is a new item. Images (JPEG, PNG) only to
      start, accepted under a named upload profile (`avatar`: 100 KB, 2048 px a side), judged by content, bounded before
      decoding and re-encoded from pixels so no photo metadata is kept; status leaves room for video (`processing`).
      Has no authentication of its own (its consumer's BFF is the gate). Staff can remove an item (bytes deleted, record kept). Also takes over the avatar tn-user-service
      holds today (okayat user-avatar-on-media).
    repo: tn-media-service
    status: active
    api: >-
      POST /v1/media?profile=&owner= (the picture as the body), GET /v1/media/{id}, GET /v1/media/{id}/content,
      DELETE /v1/media/{id}, POST /v1/media/{id}/actions/remove
    requested_changes:
      - by: okayat report-pictures, review-reported-pictures and moderation (admin-console series, revised 2026-10-22)
        summary: >-
          Staff removal of an item: the bytes deleted, the record kept, and a removed item no longer served. Idempotent. Met
          by the existing endpoint (the service has no authentication of its own; its consumer's BFF is the gate). No
          restore is requested: a removed picture is not brought back. Reports, hiding while reported and listing reported
          items are NOT requested: reports are held by okayat-moderation-service, and reporting changes nothing.
        api: >-
          POST /v1/media/{id}/actions/remove

  # Services present in the tn layer but not yet catalogued in detail:
  #   tn-data-service(-jdbc/-jpa), tn-directory-service,
  #   tn-element-service, tn-file-service, tn-storage-service, tn-cli
