# Inventory of tn-layer component repositories.
# One entry per independently-releasable repo. `type` selects which standard sets
# apply (see standards/component-types.yaml).
#
# Status: initial skeleton — types are best-effort from directory inspection and
# should be confirmed against each repo's own component.yaml when that is added.

version: 1
layer: tn-claude

components:

  - name: tn-parent
    type: maven-aggregator
    groupId: com.tn
    repo: tn-parent
    notes: Parent POM. Not a code component; sets the build baseline for everything.

  - name: tn-lang
    type: java-library
    groupId: com.tn
    repo: tn-lang

  - name: tn-query
    type: java-library
    groupId: com.tn.query
    repo: tn-query
    notes: Repo contains a small reactor (tn-query, tn-query-java, tn-query-jdbc, tn-query-jpa).

  - name: tn-cli
    type: java-cli
    groupId: com.tn
    repo: tn-cli

  - name: tn-client-feign
    type: java-library
    groupId: com.tn.client
    repo: tn-client-feign

  - name: tn-temporary-token-service
    type: java-spring-service
    groupId: com.tn.service
    repo: tn-temporary-token-service
    notes: Generic OTP-style token generate/verify. No identity concept — reusable as-is.

  - name: tn-temporary-token-service-container
    type: java-service-container
    groupId: com.tn
    repo: tn-temporary-token-service-container
    notes: >-
      Builds the deployable image for tn-temporary-token-service. Current, not
      deprecated (previously miscatalogued as such here — corrected after
      confirming its pom.xml still targets the active jar). Nothing in tn is in
      production, so "current" here means "the one to build on", not "serving
      traffic". Its own
      tn-parent pin (0.0.01-SNAPSHOT) is very stale — needs bumping whenever
      it's next touched, same class of issue as the jar repos audited in
      openspec/changes/add-identity-and-notification-capabilities/standards-audit.md.

  - name: tn-auth-service
    type: java-spring-service
    groupId: com.tn.service
    repo: tn-auth-service
    notes: >-
      JWT session issuance, keyed by a generic Identifier (email or phone) as of
      the add-identity-and-notification-capabilities change. Supersedes
      tn-oauth-service.

  - name: tn-auth-service-container
    type: java-service-container
    groupId: com.tn
    repo: tn-auth-service-container
    notes: >-
      Builds the deployable image for tn-auth-service — the oauth->auth rename
      had moved the jar repo but never replaced tn-oauth-service-container;
      this closes that gap. Base image is eclipse-temurin:25-jdk-alpine
      (tn-parent targets Java 25) — confirmed by actually running the built
      image, not just building it; the sibling repos' Java 21 base would crash
      with UnsupportedClassVersionError against jars built to this pom's
      release target.

  - name: tn-user-service
    type: java-spring-service
    groupId: com.tn.service
    repo: tn-user-service
    notes: >-
      Profile, keyed by a generic Identifier (email or phone) as of the
      add-identity-and-notification-capabilities change. Own hand-written
      controller (REST CRUD + POST /v1/actions/find-or-create), replacing
      tn-data-service's generic DataController.

  - name: tn-user-service-container
    type: java-service-container
    groupId: com.tn
    repo: tn-user-service-container
    notes: >-
      Builds the deployable image for tn-user-service — no container repo
      existed for this service before now. Base image is
      eclipse-temurin:25-jdk-alpine (tn-parent targets Java 25), following
      tn-auth-service-container's precedent from the same change.

  - name: tn-notification-service
    type: java-spring-service
    groupId: com.tn.service
    repo: tn-notification-service
    status: planned
    notes: Does not exist yet. Requested by okayat-platform / initial-capabilities. See catalog.yaml.

  # Services present but not yet catalogued in detail (type java-spring-service, to
  # be confirmed):
  #   tn-service, tn-data-service, tn-data-service-jdbc, tn-data-service-jpa,
  #   tn-directory-service, tn-element-service, tn-file-service, tn-storage-service

  # Deprecated / superseded (do not build on):
  #   tn-oauth-service (superseded by tn-auth-service), tn-oauth-service-container
  #   (pairs with the deprecated jar; tn-auth-service-container should replace it,
  #   not extend it), tn-service-deprecated, tn-query-mono
